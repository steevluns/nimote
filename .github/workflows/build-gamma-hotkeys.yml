name: Build Gamma Hotkeys (Windows 7)
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile EXE
        shell: pwsh
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (!(Test-Path $csc)) { $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe" }
          & $csc /nologo /target:winexe /out:GammaHotkeys.exe /reference:System.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll GammaHotkeys/GammaHotkeys.cs
          if ($LASTEXITCODE -ne 0) { throw "Compilation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: GammaHotkeys-Windows7
          path: GammaHotkeys.exe
